name: Build BUGrock Launcher

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release x64
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet Packages
        run: nuget restore MCLauncher.sln

      - name: Build Solution (x64 Release)
        run: msbuild MCLauncher.sln /p:Configuration=Release /p:Platform=x64 /p:RestorePackagesConfig=true /m

      - name: Package Release Files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build_artifacts
          Copy-Item -Path x64\Release\* -Destination build_artifacts -Recurse -Force
          Write-Host "Files in build_artifacts:"
          Get-ChildItem -Path build_artifacts

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BUGrock-Launcher-x64
          path: build_artifacts/
